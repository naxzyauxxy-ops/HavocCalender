# ============================================================================
#  HavocCalendar - rewards.yml
#
#  Each day (1-25) supports:
#    item-material      Bukkit material shown while the door is AVAILABLE
#                       (CHEST, TRAPPED_CHEST, BARREL, ENDER_CHEST, BUNDLE, PLAYER_HEAD ...)
#    head-texture       (optional, PLAYER_HEAD only) base64 value, textures.minecraft.net
#                       URL or texture hash - gives you a custom "present" head.
#    display-name       Name while available
#    lore-unlocked      Lore while available to claim
#    lore-claimed       Lore once claimed
#    lore-locked        Lore while locked (future day)
#    lore-missed        Lore when missed (only if allow-retroactive-claims: false)
#    commands           Actions run on claim, in order. Prefixes:
#                         (none) / [console]  - run from console
#                         [player]            - run as the player
#                         [message] <text>    - message to the player (action bar or chat)
#                         [broadcast] <text>  - server-wide message
#    claim-message      (optional) replaces the default claim message
#    broadcast-message  (optional) broadcast to the whole server when claimed
#
#  Placeholders: %player_name% %player_uuid% %day%
#  Lore extras:  %unlock_date% %days_until% %days_until_christmas%
#
#  Any lore key omitted from a day falls back to the 'defaults' section.
# ============================================================================

defaults:
  item-material: CHEST
  lore-claimed:
    - ""
    - "&8&mAlready opened"
    - "&7You claimed this gift. &8✔"
  lore-locked:
    - ""
    - "&7This door is still locked!"
    - "&7Unlocks: &f%unlock_date%"
    - "&7In &f%days_until% &7day(s)"
    - ""
    - "&8No peeking..."
  lore-missed:
    - ""
    - "&7You missed this day."
    - "&8Santa brought you coal instead."

